name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: periovoice-web/package-lock.json

      - name: Install and Build
        run: |
          cd periovoice-web
          npm install
          npm run build
          cp build/index.html build/404.html
        env:
          REACT_APP_API_URL: https://periovoiceai.onrender.com
          CI: false

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: periovoice-web/build
          branch: gh-pages
