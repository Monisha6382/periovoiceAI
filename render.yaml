services:
  # 1. FastAPI Python Backend
  - type: web
    name: periovoice-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: FIREBASE_PROJECT_ID
        value: periovoiceai
      - key: FIREBASE_STORAGE_BUCKET
        value: periovoiceai.firebasestorage.app
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false # User must paste their Firebase service account JSON string here

  - type: static
    name: periovoice-frontend
    buildCommand: cd periovoice-web && npm install && npm run build
    publishPath: periovoice-web/build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: periovoice-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
