services:
  - type: web
    name: periovoice-ai-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: periovoiceai
      - key: FIREBASE_STORAGE_BUCKET
        value: periovoiceai.firebasestorage.app
      - key: PYTHON_VERSION
        value: 3.11.0