[pytest]
testpaths = backend
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
norecursedirs = .venv venv .git node_modules periovoice-web selenium-tests appium-tests baseline-tests
markers =
    core: core clinical and AI test cases for PerioVoice AI
